{% set name = "cesard" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0233fe7d17dc38f87af588cdbe8c4a51ef6391fdf63bb81aa62596a8a21878eb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - setuptools_scm
  run:
    - asf_search
    - gdal >=3.5.0
    - geopandas
    - lxml
    - multiformats >=0.3.1
    - numpy
    - pandas
    - pyroSAR >=0.39.0
    - pystac >=1.8.0,<1.11.0
    - python >=3.11
    - python-dateutil
    - requests
    - scipy
    - spatialist >=0.20.1

test:
  imports:
    - cesard
  commands:
    - pip check
  requires:
    - python >=3.11
    - pip

about:
  home: https://github.com/SAR-ARD/cesard
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Central SAR ARD Tools

  description: |
    Central functionalities for creating Synthetic Aperture Radar (SAR) Analysis Ready Data (ARD) products.
  doc_url: https://cesard.readthedocs.io
  dev_url: https://github.com/SAR-ARD/cesard

extra:
  recipe-maintainers:
    - johntruckenbrodt
