{% set name = "cesard" %}
{% set version = "1.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 66504c81d943bc7c175b6bd6bec64957419779121349e11d4c75dd043dfb6ae5

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - setuptools_scm
  run:
    - asf_search
    - gdal >=3.5.0
    - geopandas
    - lxml
    - multiformats >=0.3.1
    - numpy
    - pandas
    - pyroSAR >=0.39.0
    - pystac >=1.8.0,<1.11.0
    - python >=3.11
    - python-dateutil
    - requests
    - scipy
    - spatialist >=0.20.1

test:
  imports:
    - cesard
  commands:
    - pip check
  requires:
    - python >=3.11
    - pip

about:
  home: https://github.com/SAR-ARD/cesard
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Central SAR ARD Tools

  description: |
    Central functionalities for creating Synthetic Aperture Radar (SAR) Analysis Ready Data (ARD) products.
  doc_url: https://cesard.readthedocs.io
  dev_url: https://github.com/SAR-ARD/cesard

extra:
  recipe-maintainers:
    - johntruckenbrodt
